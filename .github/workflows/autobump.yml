name: brew bump

on:
  # eval-exec/neomacs dispatches neomacs_release_published_v1 as soon as a
  # stable release is published; the schedule is the reconciliation path for
  # a missed dispatch.
  repository_dispatch:
    types: [neomacs_release_published_v1]
  workflow_dispatch:
  schedule:
    # Five-minute reconciliation for a missed dispatch -- GitHub's minimum
    # schedule interval.  A tick only runs livecheck against the release API
    # and commits when a newer version exists, so a frequent timer stays
    # cheap.  The step starts at minute 2 to skip GitHub's congested
    # top-of-the-hour slot.
    - cron: "2-59/5 * * * *"

permissions: {}

# macOS runners start slower than Linux ones, so a run can still be in flight
# when the next five-minute tick fires.  Queue the tick instead of cancelling a
# bump midway; by the time it starts, the livecheck below will skip it.
concurrency:
  group: autobump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    # Cask bumps are audited on macOS: `brew audit` downloads and mounts the
    # DMG artifacts with `hdiutil`, which does not exist on Linux.  This
    # mirrors Homebrew's own autobump workflow (macos-26).
    runs-on: macos-26
    permissions:
      contents: write
      actions: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          # Configure git's Authorization header so the bump step can push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      # setup-homebrew checks out the commit that triggered the run.  A queued
      # scheduled run may have been created before the previous run pushed its
      # bump, so fast-forward to the current main before checking the version.
      - name: Update the tap to the latest main
        run: git pull --ff-only origin main

      # livecheck uses the cask's own `github_latest` strategy and only emits
      # a version when the cask is outdated, so an equal or newer cask version
      # (say, after a manual bump) never triggers a re-bump or a downgrade.
      - name: Check for a newer release
        id: livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(brew livecheck --cask --json --newer-only \
            neomacs-core/tap/neomacs | jq -r '.[0].version.latest // empty')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Commit straight to main rather than opening a pull request: the
      # organization does not allow GitHub Actions to create pull requests.
      # `bump-cask-pr` still audits the bumped cask (including mounting the
      # DMGs) before it commits.
      - name: Bump cask
        if: steps.livecheck.outputs.version != ''
        env:
          VERSION: ${{ steps.livecheck.outputs.version }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
        run: |
          brew bump-cask-pr neomacs-core/tap/neomacs \
            --version="${VERSION}" --write-only --commit
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so kick
      # off tests.yml explicitly to install and uninstall the bumped cask.
      - name: Test the bumped cask
        if: steps.livecheck.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tests.yml --repo "${GITHUB_REPOSITORY}" --ref main
