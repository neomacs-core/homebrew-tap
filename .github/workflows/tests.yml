name: brew audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  cask:
    runs-on: macos-26
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      # Check out before Homebrew setup: setup-homebrew configures git
      # credentials, and actions/checkout then sends its own Authorization
      # header as well, which GitHub rejects with
      # `remote: Duplicate header: "Authorization"` (HTTP 400).
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Homebrew rejects cask paths outside a tap, so tap the checked-out
      # repository itself; every later step uses the fully qualified token
      # and therefore audits the content of this revision.
      - name: Tap the checked-out repository
        id: tap
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          tap="${GITHUB_REPOSITORY_OWNER}/${repo#homebrew-}"
          echo "name=${tap}" >> "${GITHUB_OUTPUT}"
          brew tap --force "${tap}" "$PWD"

      - name: Style
        run: brew style --cask "${{ steps.tap.outputs.name }}/neomacs"

      - name: Audit
        run: brew audit --cask --strict --online "${{ steps.tap.outputs.name }}/neomacs"

      - name: Livecheck
        run: brew livecheck --cask "${{ steps.tap.outputs.name }}/neomacs"

      - name: Fetch (verify checksum)
        run: brew fetch --cask --retry --force "${{ steps.tap.outputs.name }}/neomacs"
        timeout-minutes: 30

      - name: Install
        run: brew install --cask "${{ steps.tap.outputs.name }}/neomacs"
        timeout-minutes: 30

      - name: Uninstall
        run: brew uninstall --cask neomacs
        timeout-minutes: 10
